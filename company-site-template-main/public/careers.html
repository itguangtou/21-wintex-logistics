<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting…</title>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var lang = p.get('lang');
      var locale = lang === 'en' ? 'en' : 'zh';
      location.replace('/' + locale + '/careers');
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=/zh/careers" />
</head>
<body>
  <p><a href="/zh/careers">Careers</a></p>
</body>
</html>
